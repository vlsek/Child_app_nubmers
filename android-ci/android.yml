# Скопируйте этот файл в .github/workflows/android.yml (токен без права workflow не может создать его сам).
name: Android APK

# Собирает debug-APK при каждом пуше в main (или вручную): скачайте файл из Actions → Artifacts.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: krokodil-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
